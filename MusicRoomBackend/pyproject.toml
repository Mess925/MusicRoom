[project]
name = "musicroom-backend"
version = "0.1.0"
description = "Music Room backend API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.40.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "asyncpg>=0.30.0",
    "alembic>=1.17.0",
    "redis>=6.5.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["src", "."]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs live PostgreSQL and Redis (deselect with '-m \"not integration\"')",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
