[project]
name = "musicroom-backend"
version = "0.1.0"
description = "Music Room backend API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.40.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "asyncpg>=0.30.0",
    "alembic>=1.17.0",
    "redis>=6.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["src"]
